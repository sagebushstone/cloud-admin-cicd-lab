name: CI - Build and Publish Container
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]
permissions:
  contents: read
  packages: write
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cloud-admin-cicd-lab
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show repository files
        run: tree -a -I '.git'
      - name: Validate required files
        run: |
          test -f Dockerfile
          test -f app/index.html
          test -f app/health.html
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image for test
        run: docker build -t cloud-admin-cicd-lab:test .
      - name: Run container smoke test
        run: |
          docker run -d --name test-web -p 8080:80 cloud-admin-cicd-lab:test
          sleep 3
          curl -f http://localhost:8080
          curl -f http://localhost:8080/health.html
          docker stop test-web
          docker rm test-web
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
