apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-admin-web
  namespace: cicd-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-admin-web
  template:
    metadata:
      labels:
        app: cloud-admin-web
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /health.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-admin-web
  namespace: cicd-lab
spec:
  replicas: 2
  revisionHistoryLimit: 5
selector:
  matchLabels:
    app: cloud-admin-web
template:
  metadata:
    labels:
      app: cloud-admin-web
  spec:
    containers:
    - name: web
      image: ghcr.io/sagebushstone/cloud-admin-cicd-lab:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 80
      envFrom:
        - configMapRef:
          name: cloud-admin-web-config
        - secretRef:
          name: cloud-admin-web-secret
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "128Mi"
      readinessProbe:
        httpGet:
          path: /health.html
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /health.html
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 10
